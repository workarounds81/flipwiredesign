name: Preview

# Publishes a static build to GitHub Pages so the site can be reviewed before
# the production deploy on flipwiredesign.com. Enable it once, under
# Settings -> Pages -> Source -> GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that's mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/configure-pages@v5
        id: pages

      - run: npm ci

      - name: Build static export
        env:
          STATIC_EXPORT: "1"
          # Project sites are served from /<repo>, so the app needs a base path.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      # Without this, Pages runs the output through Jekyll, which drops
      # directories beginning with an underscore — including Next's _next/.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
